<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyrje</title>

    <style>
        body{
            font-family:Segoe UI, sans-serif;
            background:#eef2ff;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-box{
            background:white;
            padding:30px;
            width:350px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:10px;
            box-sizing:border-box;
            border:1px solid #ddd;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:8px;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }

        .register-link{
            text-align:center;
            margin-top:15px;
        }

        .register-link a{
            color:#2563eb;
            text-decoration:none;
        }
    </style>
</head>
<body>

<div class="login-box">

    <h2>💰 Menaxhuesi i Shpenzimeve</h2>

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="login()">
        Hyr
    </button>

    <div class="register-link">
        Nuk ke llogari?
        <a href="register.html">
            Regjistrohu
        </a>
    </div>

</div>

<script>

async function login(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    try{

        const response = await fetch(
            "http://localhost:5000/api/auth/login",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({
                    username,
                    password
                })
            }
        );

        const data =
            await response.json();

        if(response.ok){

            localStorage.setItem(
                "username",
                data.username
            );

            alert(
                "Login me sukses ✅"
            );

            window.location.href =
                "index.html";

        }else{

            alert(
                data.message
            );
        }

    }catch(error){

        console.log(error);

        alert(
            "Gabim ne lidhje me serverin"
        );
    }
}

</script>

</body>
</html>
