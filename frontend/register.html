<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regjistrim</title>

    <style>
        body{
            font-family:Segoe UI,sans-serif;
            background:#eef2ff;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-box{
            background:white;
            padding:30px;
            width:350px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:10px;
            box-sizing:border-box;
            border:1px solid #ddd;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        a{
            text-decoration:none;
            color:#2563eb;
        }

        .login-link{
            text-align:center;
            margin-top:15px;
        }
    </style>
</head>
<body>

<div class="register-box">

    <h2>📝 Regjistrohu</h2>

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="register()">
        Regjistrohu
    </button>

    <div class="login-link">
        Ke llogari?
        <a href="login.html">
            Hyr
        </a>
    </div>

</div>

<script>

async function register(){

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    try{

        const response = await fetch(
            "http://localhost:5000/api/auth/register",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({
                    username,
                    password
                })
            }
        );

        const data =
            await response.json();

        if(response.ok){

            alert(
                "Llogaria u krijua me sukses ✅"
            );

            window.location.href =
                "login.html";

        }else{

            alert(data.message);
        }

    }catch(error){

        alert(
            "Gabim ne lidhje me serverin"
        );
    }
}

</script>

</body>
</html>
